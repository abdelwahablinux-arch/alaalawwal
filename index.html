<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant - Live Ordering</title>
    <style>
        /* Your existing styles here (copy from previous) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f7f7f7; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .menu-mode { display: block; }
        .order-mode { display: none; }
        .header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: 20px; margin-bottom: 30px; }
        .menu-grid { display: grid; gap: 16px; }
        .card { background: white; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .price { color: #667eea; font-weight: bold; font-size: 18px; }
        .btn { background: #667eea; color: white; border: none; padding: 8px 20px; border-radius: 25px; cursor: pointer; }
        .btn-success { background: #48bb78; }
        .cart-btn { position: fixed; bottom: 20px; right: 20px; background: #667eea; color: white; width: 60px; height: 60px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; }
        .cart-count { position: absolute; top: -5px; right: -5px; background: #e53e3e; color: white; border-radius: 50%; width: 24px; height: 24px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .cart-sidebar { position: fixed; top: 0; right: -400px; width: 400px; height: 100%; background: white; box-shadow: -2px 0 12px rgba(0,0,0,0.2); transition: right 0.3s; z-index: 200; display: flex; flex-direction: column; }
        .cart-sidebar.open { right: 0; }
        .cart-header { padding: 20px; background: #2d3748; color: white; display: flex; justify-content: space-between; }
        .cart-items { flex: 1; padding: 20px; overflow-y: auto; }
        .cart-footer { padding: 20px; border-top: 2px solid #e2e8f0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 150; }
        .overlay.show { display: block; }
        .exit-btn { position: fixed; top: 20px; right: 20px; background: #e53e3e; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; z-index: 100; }
        .table-badge { background: #48bb78; color: white; padding: 5px 12px; border-radius: 20px; display: inline-block; margin-left: 10px; }
        .error-message { background: #fed7d7; color: #c53030; padding: 15px; border-radius: 8px; margin: 20px; text-align: center; }
        .quantity-control { display: flex; align-items: center; gap: 8px; }
        .qty-btn { background: #e2e8f0; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="menuMode" class="menu-mode">
        <div class="header">
            <h1>🍽️ Our Menu</h1>
            <p>Scan QR code at your table to start ordering</p>
        </div>
        <div id="menuList" class="menu-grid"></div>
    </div>
    
    <div id="orderMode" class="order-mode">
        <button class="exit-btn" onclick="exitOrderMode()">← Back to Menu</button>
        <div class="header">
            <h1>🍕 Live Ordering <span id="tableBadge" class="table-badge"></span></h1>
            <p>Add items to your cart and place your order</p>
            <small>⏰ Session expires in 30 seconds</small>
        </div>
        <div id="orderMenuList" class="menu-grid"></div>
    </div>
</div>

<div id="cartBtn" class="cart-btn" onclick="openCart()">
    🛒
    <span id="cartCount" class="cart-count">0</span>
</div>

<div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
        <h3>🛒 Your Order</h3>
        <button onclick="closeCart()">×</button>
    </div>
    <div id="cartItemsList" class="cart-items">Cart is empty</div>
    <div class="cart-footer">
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 15px;">
            Total: $<span id="totalAmount">0</span>
        </div>
        <button class="btn btn-success" onclick="submitOrder()" style="width: 100%; padding: 12px;">
            📝 Place Order
        </button>
    </div>
</div>

<div id="overlay" class="overlay" onclick="closeCart()"></div>

<script>
    // ============ CONFIGURATION ============
    // UPDATE THIS WITH YOUR CLOUDFLARE TUNNEL URL
    const API_BASE = 'https://backed-wish-firewire-changing.trycloudflare.com';  // ← CHANGE THIS!
    
    let menu = [];
    let cart = [];
    let qrToken = null;
    let tableNumber = null;
    let isOrderModeActive = false;
    
    const urlParams = new URLSearchParams(window.location.search);
    const modeParam = urlParams.get('mode');
    const tokenParam = urlParams.get('token');
    const tableParam = urlParams.get('table');
    
    const sessionToken = sessionStorage.getItem('qr_token');
    const sessionTable = sessionStorage.getItem('table_number');
    
    if ((modeParam === 'order' && tokenParam) || sessionToken) {
        qrToken = tokenParam || sessionToken;
        tableNumber = tableParam || sessionTable;
        sessionStorage.removeItem('qr_token');
        sessionStorage.removeItem('table_number');
        verifyTokenAndEnterOrderMode();
    } else {
        showMenuMode();
    }
    
    async function verifyTokenAndEnterOrderMode() {
        try {
            const response = await fetch(`${API_BASE}/api/verify?token=${qrToken}`);
            const data = await response.json();
            
            if (data.valid) {
                tableNumber = data.tableNumber;
                showOrderMode();
                setTimeout(() => {
                    if (isOrderModeActive) {
                        alert('Your ordering session has expired. Please scan QR code again.');
                        exitOrderMode();
                    }
                }, 30000);
            } else {
                showInvalidTokenMessage();
            }
        } catch (err) {
            console.error('Verification error:', err);
            showServerError();
        }
    }
    
    function showMenuMode() {
        isOrderModeActive = false;
        document.getElementById('menuMode').style.display = 'block';
        document.getElementById('orderMode').style.display = 'none';
        document.getElementById('cartBtn').style.display = 'none';
        loadMenu(false);
        if (window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    }
    
    function showOrderMode() {
        isOrderModeActive = true;
        document.getElementById('menuMode').style.display = 'none';
        document.getElementById('orderMode').style.display = 'block';
        document.getElementById('cartBtn').style.display = 'flex';
        document.getElementById('tableBadge').textContent = `Table ${tableNumber}`;
        loadMenu(true);
        updateCartUI();
    }
    
    function showInvalidTokenMessage() {
        const orderModeDiv = document.getElementById('orderMode');
        orderModeDiv.style.display = 'block';
        orderModeDiv.innerHTML = `
            <div class="header" style="background: linear-gradient(135deg, #e53e3e, #c53030);">
                <h1>⏰ Invalid or Expired QR Code</h1>
                <p>This QR code has already been used or expired</p>
            </div>
            <div class="error-message">
                <button class="btn" onclick="window.location.href=window.location.pathname">← Back to Menu</button>
            </div>
        `;
        document.getElementById('menuMode').style.display = 'none';
        document.getElementById('cartBtn').style.display = 'none';
    }
    
    function showServerError() {
        const orderModeDiv = document.getElementById('orderMode');
        orderModeDiv.style.display = 'block';
        orderModeDiv.innerHTML = `
            <div class="header" style="background: linear-gradient(135deg, #e53e3e, #c53030);">
                <h1>🔌 Connection Error</h1>
                <p>Unable to connect to server</p>
            </div>
            <div class="error-message">
                <button class="btn" onclick="window.location.reload()">Retry</button>
            </div>
        `;
        document.getElementById('menuMode').style.display = 'none';
        document.getElementById('cartBtn').style.display = 'none';
    }
    
    async function loadMenu(withButtons) {
        try {
            const response = await fetch(`${API_BASE}/api/menu`);
            if (!response.ok) throw new Error('Menu fetch failed');
            menu = await response.json();
            
            const containerId = withButtons ? 'orderMenuList' : 'menuList';
            const container = document.getElementById(containerId);
            
            const html = menu.map(item => `
                <div class="card">
                    <div style="flex: 1;">
                        <h3>${escapeHtml(item.name)}</h3>
                        <p style="color: #666; font-size: 14px;">${escapeHtml(item.desc)}</p>
                        <div class="price">$${item.price.toFixed(2)}</div>
                    </div>
                    ${withButtons ? `<button class="btn" onclick="addToCart(${item.id})">Add to Cart +</button>` : ''}
                </div>
            `).join('');
            
            container.innerHTML = html;
        } catch (err) {
            console.error('Error loading menu:', err);
        }
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function addToCart(id) {
        if (!isOrderModeActive) return;
        const item = menu.find(i => i.id === id);
        const existing = cart.find(i => i.id === id);
        if (existing) {
            existing.quantity++;
        } else {
            cart.push({ ...item, quantity: 1 });
        }
        updateCartUI();
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = '✓ Added!';
        btn.style.background = '#48bb78';
        setTimeout(() => {
            btn.textContent = originalText;
            btn.style.background = '#667eea';
        }, 800);
    }
    
    function updateCartUI() {
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').textContent = itemCount;
        document.getElementById('totalAmount').textContent = total.toFixed(2);
        
        if (cart.length === 0) {
            document.getElementById('cartItemsList').innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">Your cart is empty 🛒</p>';
            return;
        }
        
        document.getElementById('cartItemsList').innerHTML = cart.map(item => `
            <div class="cart-item">
                <div style="flex: 1;">
                    <strong>${escapeHtml(item.name)}</strong><br>
                    <span style="color: #667eea;">$${item.price.toFixed(2)}</span>
                </div>
                <div class="quantity-control">
                    <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                    <span>${item.quantity}</span>
                    <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                </div>
            </div>
        `).join('');
    }
    
    function updateQuantity(id, delta) {
        const itemIndex = cart.findIndex(i => i.id === id);
        if (itemIndex === -1) return;
        const item = cart[itemIndex];
        item.quantity += delta;
        if (item.quantity <= 0) {
            cart.splice(itemIndex, 1);
        }
        updateCartUI();
    }
    
    function openCart() {
        document.getElementById('cartSidebar').classList.add('open');
        document.getElementById('overlay').classList.add('show');
    }
    
    function closeCart() {
        document.getElementById('cartSidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
    }
    
    async function submitOrder() {
        if (cart.length === 0) {
            alert('Your cart is empty!');
            return;
        }
        
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const orderItems = cart.map(item => ({
            id: item.id,
            name: item.name,
            quantity: item.quantity,
            price: item.price
        }));
        
        const submitBtn = event.target;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Placing order...';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch(`${API_BASE}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    table_number: parseInt(tableNumber),
                    items: orderItems,
                    total: total,
                    token: qrToken
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                alert(`✅ ORDER PLACED! Order #${data.order_id}\nTable ${tableNumber}\nTotal: $${total.toFixed(2)}`);
                cart = [];
                updateCartUI();
                closeCart();
                exitOrderMode();
            } else {
                alert(data.error || 'Error placing order. QR code may have expired.');
                if (data.error === 'Invalid, expired, or already used QR token') {
                    showInvalidTokenMessage();
                }
            }
        } catch (err) {
            console.error('Order error:', err);
            alert('Network error. Could not place order.');
        } finally {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    }
    
    function exitOrderMode() {
        window.location.href = window.location.pathname;
    }
</script>
</body>
</html>
